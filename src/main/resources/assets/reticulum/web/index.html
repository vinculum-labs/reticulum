<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reticulum test page</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --panel: #fff; --ink: #1d2230; --muted: #6a7285; --line: #d9dde5; --accent: #2f7fd1; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15181e; --panel: #1e222a; --ink: #e4e7ee; --muted: #9098aa; --line: #2e3440; --accent: #5aa2ec; --bad: #e0685b; } }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  #status { color: var(--muted); }
  #tabs button { margin-right: 6px; }
  #tabs button.active { border-color: var(--accent); color: var(--accent); }
  main { padding: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  section h2 { font-size: 14px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; }
  img.icon { width: 24px; height: 24px; image-rendering: pixelated; vertical-align: middle; }
  input, select, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  button { cursor: pointer; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  pre { max-height: 240px; overflow: auto; font-size: 12px; margin: 0; }
  .rate { font-variant-numeric: tabular-nums; color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Reticulum</h1>
  <span id="status">Connecting…</span>
  <span id="tabs"></span>
</header>
<main id="main"><section><p class="muted">Pick a network above. This is the phase 3 test page; the real editor comes next.</p></section></main>
<script>
"use strict";
const $ = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tab = Math.random().toString(36).slice(2, 8);
let seq = 0, socket, networks = [], current = null, snapshot = null, rates = {};
const pending = new Map();

function connect() {
  socket = new WebSocket(`ws://${location.host}/ws`);
  socket.onopen = () => { send({ op: "hello" }); };
  socket.onclose = () => { status("Disconnected from the game; retrying…"); setTimeout(connect, 2000); };
  socket.onmessage = (e) => onMessage(JSON.parse(e.data));
}

function send(message) {
  const id = `${tab}-${++seq}`;
  socket.send(JSON.stringify({ id, ...message }));
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}

function status(text) { document.getElementById("status").textContent = text; }

async function onMessage(m) {
  if (m.type === "response") {
    const p = pending.get(m.id);
    if (!p) return;
    pending.delete(m.id);
    m.ok ? p.resolve(m) : p.reject(new Error(m.error));
  } else if (m.type === "hello") {
    status(m.connected ? "Connected" : "Not in a world");
    if (m.connected) await loadNetworks(m.focus || location.hash.replace("#network=", "") || null);
  } else if (m.type === "connected") {
    status("Connected"); await loadNetworks(current);
  } else if (m.type === "disconnected") {
    status("Not in a world");
  } else if (m.type === "focus") {
    if (m.network) await select(m.network);
  } else if (m.type === "snapshot" && m.network.id === current) {
    snapshot = m.network; render();
  } else if (m.type === "metrics" && m.network === current) {
    rates = m.perSecond; updateRates();
  } else if (m.type === "removed" && m.network === current) {
    current = null; snapshot = null; await loadNetworks(null);
  }
}

async function loadNetworks(focus) {
  const r = await send({ op: "networks" });
  networks = r.networks;
  status(`Connected as ${r.player}`);
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  for (const n of networks) {
    const b = $(`<button>${esc(n.name)}${n.running ? "" : " (off)"}</button>`);
    b.onclick = () => select(n.id);
    if (n.id === current) b.classList.add("active");
    tabs.append(b);
  }
  const target = focus && networks.some(n => n.id === focus) ? focus : (current || networks[0]?.id);
  if (target && target !== current) await select(target);
}

async function select(id) {
  if (current && current !== id) send({ op: "unsubscribe", network: current }).catch(() => {});
  current = id;
  location.hash = `network=${id}`;
  const r = await send({ op: "subscribe", network: id });
  snapshot = r.network;
  document.querySelectorAll("#tabs button").forEach((b, i) => b.classList.toggle("active", networks[i]?.id === id));
  render();
}

function edit(...edits) {
  return send({ op: "edit", network: current, edits }).catch(e => alert(e.message));
}

const posKey = (p) => `${p.dimension}|${p.pos.join(",")}`;
const icon = (id) => id ? `<img class="icon" src="/icon/item/${id.replace(":", "/")}.png" alt="">` : "";
function deviceLabel(p) {
  const d = snapshot.devices.find(d => posKey(d.pos) === posKey(p));
  return d ? (d.name || d.defaultName) : p.pos.join(", ");
}

function render() {
  const s = snapshot, main = document.getElementById("main");
  main.innerHTML = "";
  main.append($(`<section>
    <h2>${esc(s.name)} <span class="muted">rev ${s.revision}, ${s.running ? "running" : "not running"}, ${esc(s.access)}, you: ${esc(s.role)}</span></h2>
    <div class="row"><label><input type="checkbox" id="netOn" ${s.enabled ? "checked" : ""} ${s.canEdit ? "" : "disabled"}> Network on</label></div>
    <div class="row muted">Overflow: ${s.overflow.items.length} item stacks, ${s.overflow.fluids.length} fluids</div>
  </section>`));
  main.querySelector("#netOn").onchange = (e) => edit({ type: "setNetworkEnabled", enabled: e.target.checked });

  const devices = $(`<section><h2>Devices</h2><table><tr><th></th><th>Name</th><th>State</th><th>Offers</th></tr></table></section>`);
  for (const d of s.devices) {
    const offers = Object.entries(d.resources || {}).filter(([, faces]) => faces.length).map(([k, faces]) => `${k} (${faces.join(" ")})`).join(", ");
    const row = $(`<tr><td>${icon(d.icon)}</td><td><input value="${esc(d.name || "")}" placeholder="${esc(d.defaultName)}" ${s.canEdit ? "" : "disabled"}></td>
      <td class="${d.state === "active" ? "" : "bad"}">${esc(d.state)}</td><td class="muted">${esc(offers)}</td></tr>`);
    row.querySelector("input").onchange = (e) => edit({ type: "renameDevice", device: d.pos, name: e.target.value });
    devices.querySelector("table").append(row);
  }
  main.append(devices);

  const sheets = $(`<section><h2>Sheets</h2><div class="row"><input id="sheetName" placeholder="New sheet name"><button id="addSheet">Add sheet</button></div><div id="sheetList"></div></section>`);
  sheets.querySelector("#addSheet").onclick = () => { const n = sheets.querySelector("#sheetName").value.trim(); if (n) edit({ type: "createSheet", name: n }); };
  for (const sheet of s.sheets) sheets.querySelector("#sheetList").append(renderSheet(sheet));
  main.append(sheets);

  const filters = $(`<section><h2>Filter templates</h2><table></table>
    <div class="row"><input id="fName" placeholder="name"><input id="fExpr" placeholder="e.g. tag:c:ores" size="30"><button id="fAdd">Save</button><span id="fCheck" class="muted"></span></div></section>`);
  for (const [name, expr] of Object.entries(s.filters)) {
    const row = $(`<tr><td>@${esc(name)}</td><td><code>${esc(expr)}</code></td><td><button>Remove</button></td></tr>`);
    row.querySelector("button").onclick = () => edit({ type: "setFilter", name });
    filters.querySelector("table").append(row);
  }
  const fExpr = filters.querySelector("#fExpr");
  fExpr.oninput = async () => {
    const r = await send({ op: "checkFilter", network: current, expression: fExpr.value });
    filters.querySelector("#fCheck").textContent = r.valid ? "valid" : r.message;
    filters.querySelector("#fCheck").className = r.valid ? "muted" : "bad";
  };
  filters.querySelector("#fAdd").onclick = () => edit({ type: "setFilter", name: filters.querySelector("#fName").value.trim(), expression: fExpr.value });
  main.append(filters);
  updateRates();
}

function renderSheet(sheet) {
  const box = $(`<div style="border-top:1px solid var(--line); padding-top:8px; margin-top:8px">
    <div class="row"><b>${esc(sheet.name)}</b>
      <label><input type="checkbox" class="on" ${sheet.enabled !== false ? "checked" : ""}> on</label>
      <label>every <input class="interval" type="number" min="1" value="${sheet.interval ?? 10}" style="width:4em"> ticks</label>
      <button class="del">Delete sheet</button></div>
    ${(sheet.errors || []).map(e => `<div class="bad">${esc(e)}</div>`).join("")}
    <table class="nodes"><tr><th>Node</th><th>Detail</th><th>Per second</th><th></th></tr></table>
    <div class="row">Quick flow:
      <select class="res"><option>item</option><option>fluid</option><option>energy</option></select>
      from <select class="src"></select> to <select class="dst"></select>
      <input class="filter" placeholder="filter (optional)" size="18">
      <span class="itemAmount">move <select class="amount"><option value="1">single</option><option value="0" selected>stack</option><option value="custom">custom</option></select>
        <input class="custom" type="number" min="1" value="16" style="width:5em; display:none"> per operation</span>
      <span class="rateBox" style="display:none">max <input class="rate" type="number" min="1" placeholder="unlimited" style="width:7em"> <span class="rateUnit">mB</span>/s</span>
      <button class="add">Add</button></div>
  </div>`);
  box.querySelector(".on").onchange = (e) => edit({ type: "updateSheet", sheet: sheet.id, enabled: e.target.checked });
  box.querySelector(".interval").onchange = (e) => edit({ type: "updateSheet", sheet: sheet.id, interval: +e.target.value });
  box.querySelector(".del").onclick = () => confirm(`Delete sheet ${sheet.name}?`) && edit({ type: "deleteSheet", sheet: sheet.id });
  for (const node of sheet.nodes || []) {
    const st = node.settings;
    const amountText = st.kind === "source" && st.resource === "item" ? `, ${!st.per_operation ? "a stack" : st.per_operation === 1 ? "single" : st.per_operation} per op` : "";
    const detail = st.device ? `${st.resource} ${st.kind === "source" ? "from" : "to"} ${esc(deviceLabel(st.device))}${amountText}`
      : st.expression !== undefined ? `<code>${esc(st.expression)}</code>`
      : st.per_second !== undefined ? `${st.per_second}/s`
      : st.lines ? st.lines.map(l => `${l.count}× ${esc(l.filter)}`).join(" + ") : esc(st.mode || "");
    const row = $(`<tr><td>${esc(st.kind)}</td><td>${detail}</td><td class="rate" data-id="${node.id}">0</td><td><button>Remove</button></td></tr>`);
    row.querySelector("button").onclick = () => edit({ type: "removeNode", sheet: sheet.id, node: node.id });
    box.querySelector(".nodes").append(row);
  }
  const res = box.querySelector(".res"), src = box.querySelector(".src"), dst = box.querySelector(".dst");
  const fill = () => {
    const offering = snapshot.devices.filter(d => d.resources && d.resources[res.value]?.length);
    const opts = offering.map((d, i) => `<option value="${i}">${esc(d.name || d.defaultName)}</option>`).join("");
    src.innerHTML = opts; dst.innerHTML = opts;
    src.devices = offering; if (offering.length > 1) dst.value = "1";
  };
  const amount = box.querySelector(".amount"), custom = box.querySelector(".custom");
  amount.onchange = () => { custom.style.display = amount.value === "custom" ? "" : "none"; };
  const modes = () => {
    const items = res.value === "item";
    box.querySelector(".itemAmount").style.display = items ? "" : "none";
    box.querySelector(".rateBox").style.display = items ? "none" : "";
    box.querySelector(".rateUnit").textContent = res.value === "energy" ? "FE" : "mB";
  };
  res.onchange = () => { fill(); modes(); }; fill(); modes();
  box.querySelector(".add").onclick = () => {
    const from = src.devices[+src.value], to = src.devices[+dst.value];
    if (!from || !to) return;
    const port = (d) => ({ resource: res.value, device: d.pos, faces: [] });
    const perOperation = amount.value === "custom" ? Math.max(1, +custom.value || 1) : +amount.value;
    const source = { id: crypto.randomUUID(), settings: { kind: "source", ...port(from), ...(res.value === "item" ? { per_operation: perOperation } : {}) } };
    const sink = { id: crypto.randomUUID(), settings: { kind: "sink", ...port(to) } };
    const edits = [{ type: "addNode", sheet: sheet.id, node: source }, { type: "addNode", sheet: sheet.id, node: sink }];
    const expr = box.querySelector(".filter").value.trim();
    const wire = (a, b) => ({ type: "connect", sheet: sheet.id, wire: { id: crypto.randomUUID(), from: a.id, to: b.id } });
    // Chain: source -> [filter] -> [rate limit] -> sink
    const chain = [source];
    if (expr) {
      const filter = { id: crypto.randomUUID(), settings: { kind: "filter", expression: expr } };
      edits.push({ type: "addNode", sheet: sheet.id, node: filter });
      chain.push(filter);
    }
    const rate = +box.querySelector(".rate").value;
    if (res.value !== "item" && rate > 0) {
      const limit = { id: crypto.randomUUID(), settings: { kind: "rate_limit", per_second: rate } };
      edits.push({ type: "addNode", sheet: sheet.id, node: limit });
      chain.push(limit);
    }
    chain.push(sink);
    for (let i = 0; i + 1 < chain.length; i++) edits.push(wire(chain[i], chain[i + 1]));
    edit(...edits);
  };
  return box;
}

function updateRates() {
  document.querySelectorAll(".rate").forEach(td => { td.textContent = rates[td.dataset.id] ?? 0; });
}

connect();
</script>
</body>
</html>
