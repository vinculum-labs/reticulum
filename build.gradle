plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
    id 'com.github.node-gradle.node' version '7.1.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude(".cache/**")
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    maven {
        name = 'ModMaven (Mekanism)'
        url = 'https://modmaven.dev'
        content { includeGroup 'mekanism' }
    }
    maven {
        name = 'NeoForged (AE2)'
        url = 'https://maven.neoforged.net/releases'
        content { includeGroup 'org.appliedenergistics' }
    }
    maven {
        name = 'K-4u (The One Probe)'
        url = 'https://maven.k-4u.nl'
        content { includeGroup 'mcjty.theoneprobe' }
    }
    maven {
        name = 'Modrinth (Jade)'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // Serve the web editor straight from web/dist, so `npm run dev` changes show on a browser refresh.
            systemProperty 'reticulum.webRoot', file('web/dist').absolutePath
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The in-game editor (WebView2) opens DevTools' remote protocol on localhost:9222 for debugging.
            environment 'WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS', '--remote-debugging-port=9222'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Optional integrations, by their version property. A blank version (a Minecraft version the mod doesn't exist for)
// leaves the integration's sources and game tests out of the build, and Mods.java treats the mod as absent.
def has = { String property -> project.hasProperty(property) && !project.property(property).toString().isBlank() }
def integrations = [
        jei     : ['**/integration/jei/**'],
        jade    : ['**/integration/jade/**'],
        top     : ['**/integration/top/**'],
        mekanism: ['**/integration/mekanism/**', '**/engine/ChemicalMover.java', '**/gametest/Mekanism*'],
        ae2     : ['**/integration/ae2/**', '**/gametest/Ae2*'],
]
ext.integration = { String name -> has("${name}_version") }
sourceSets.main.java {
    integrations.each { name, sources ->
        if (!integration(name)) {
            exclude(sources)
        }
    }
}

dependencies {
    // The client-hosted web UI server. Minecraft ships Netty but not its HTTP module; bundled with jar-in-jar,
    // pinned to Minecraft's Netty version (netty_version, which changes with the Minecraft version).
    jarJar(implementation("io.netty:netty-codec-http")) {
        version {
            strictly "[${netty_version}, 4.2)"
            prefer netty_version
        }
    }

    // Optional integrations: compiled against, loaded only when the mod is present. Each is left out when its version
    // property is blank (see `integrations` above).
    if (integration('jei')) {
        compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
        compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
    if (integration('jade')) {
        compileOnly "maven.modrinth:jade:${jade_version}"
        localRuntime "maven.modrinth:jade:${jade_version}"
    }
    if (integration('top')) {
        compileOnly("mcjty.theoneprobe:theoneprobe:${top_version}") { transitive = false }
    }
    if (integration('mekanism')) {
        compileOnly "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:api"
        localRuntime "mekanism:Mekanism:${minecraft_version}-${mekanism_version}"
        localRuntime "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:generators"
    }
    if (integration('ae2')) {
        compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
        localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    }
    // Create, only on the dev run classpath, for trying our blocks on its contraptions (moved by mechanical pistons,
    // bearings, gantries). The mod does not depend on it.
    if (has('create_version')) {
        localRuntime "maven.modrinth:create:${create_version}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------- web editor

node {
    // A pinned Node.js is downloaded for the build, so CI and fresh checkouts need nothing installed.
    download = true
    version = '24.21.0'
    nodeProjectDir = file('web')
}

def webBuild = tasks.register('webBuild', com.github.gradle.node.npm.task.NpmTask) {
    description = 'Builds the web editor with Vite.'
    dependsOn tasks.named('npmInstall')
    args = ['run', 'build']
    inputs.dir('web/src')
    inputs.files('web/package.json', 'web/package-lock.json', 'web/vite.config.ts', 'web/tsconfig.json', 'web/index.html')
    outputs.dir('web/dist')
}

tasks.named('processResources', ProcessResources) {
    from(webBuild) {
        into 'assets/reticulum/web'
    }
}
